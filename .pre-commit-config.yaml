repos:
  # pre-commit-hooks: basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        # tsconfig はコメントを許す JSONC 形式のため除外する
        exclude: (^|/)tsconfig[^/]*\.json$
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # gitleaks: detect secrets in staged changes
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact -v
        language: system
        pass_filenames: false

  # Semgrep: detect vulnerability patterns (--error fails the commit on findings)
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.181.1
    hooks:
      - id: semgrep
        args: ["--config", "auto", "--error"]
